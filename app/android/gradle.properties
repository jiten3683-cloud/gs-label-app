org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Kotlin incremental compilation. The incremental cache cannot
# compute a relative path when the Pub cache (C:\Users\...\Pub\Cache)
# and the project (E:\...) live on different drive letters; it throws
# "IllegalArgumentException: this and base files have different roots".
kotlin.incremental=false

# Optimized resource shrinking (AGP 8.12+): integrates resource shrinking
# with R8's code optimization pass for smaller/faster release builds.
android.r8.optimizedResourceShrinking=true
